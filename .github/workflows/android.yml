name: Android APK

on:
  push:
    branches: [ main, 'arena/ab89cc9d-android-integrity-probe' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu image already supplies Android command-line tools and licenses.
      - name: Install Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Unit tests, lint and debug APK
        shell: bash
        run: |
          set -o pipefail
          if gradle testDebugUnitTest lintDebug assembleDebug --no-daemon --console=plain 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"; then
            exit 0
          else
            # Surface compiler/test failures in the Checks API as well as downloadable logs.
            python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          text = Path(os.environ['RUNNER_TEMP'], 'gradle-build.log').read_text(errors='replace')[-50000:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Gradle build failed::' + text)
          report = Path('app/build/reports/lint-results-debug.xml')
          if report.exists():
              for issue in ET.parse(report).getroot().findall('issue'):
                  if issue.get('severity') in ('Error', 'Fatal'):
                      location = issue.find('location')
                      message = issue.get('message', '').replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print(f"::error file={location.get('file')},line={location.get('line', '1')},title=Lint {issue.get('id')}::{message}")
          PY
            exit 1
          fi

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/
            ${{ runner.temp }}/gradle-build.log
          if-no-files-found: ignore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-integrity-probe-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
